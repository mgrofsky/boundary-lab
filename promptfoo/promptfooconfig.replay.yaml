# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Replay run: the same 80 tests, but the chatbot answers come from the saved attack run
# and the rig's judge uses its saved answers. Nothing calls a model, so this runs
# anywhere and gives the same result every time. The llm-rubric checks are left out
# because they need a grader model.
#
#   REDLINE_JUDGE=replay promptfoo eval -c promptfooconfig.replay.yaml

description: Northwind Power billing assistant, replayed from the saved attack run

prompts:
  - file://prompts/billing_assistant.json

providers:
  - id: file://replay_provider.py
    label: saved answers

defaultTest:
  vars:
    system_prompt: file://../policy/target_system_prompt.txt
  assert:
    - type: python
      value: file://judge_assert.py
      metric: rig_judge

tests:
  - path: file://generate_tests.py:create_tests
    config:
      rubric: false

outputPath: ../results/promptfoo/replay.json
