[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redline"
version = "0.1.0"
description = "Redline, a Boundary Lab tool for testing chatbot rules and evaluating the checks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matt Grofsky" }]
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
redline = "redline.cli:main"

[tool.setuptools.packages.find]
include = ["redline*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = ["slow: loads the embedding model, skip with -m 'not slow'"]
