[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "redline"
version = "0.1.0"
description = "Redline, a Boundary Lab tool for testing chatbot rules and evaluating the checks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matt Grofsky" }]
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=6.2.0",
    "scikit-learn>=1.9.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[project.scripts]
redline = "redline.cli:main"

[tool.setuptools.packages.find]
include = ["redline*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = ["slow: loads the embedding model, skip with -m 'not slow'"]
