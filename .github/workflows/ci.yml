name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: sentence-transformers/all-MiniLM-L6-v2
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: redline readme --check
