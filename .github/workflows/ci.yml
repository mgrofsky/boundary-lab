name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: sentence-transformers/all-MiniLM-L6-v2
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: redline readme --check
  redline-garak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" garak==0.17.1
      # The end to end tests write two files into the installed garak and remove them.
      - run: pytest -q -m garak
        env:
          REDLINE_GARAK_E2E: "1"
  redline-plain-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Redline with no extras: rules only mode must work, and torch must not be there.
      - run: |
          python -m venv /tmp/plain
          /tmp/plain/bin/pip install .
          cd /tmp
          /tmp/plain/bin/python "$GITHUB_WORKSPACE/tests/check_plain_install.py"
  latch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/latch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,demo,live]"
      - run: ruff check .
      - run: pytest -q
  dye:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/dye
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
  latch-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
        working-directory: tools/latch
      - run: twine check tools/latch/dist/*
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install tools/latch/dist/*.whl
          cd /tmp
          /tmp/clean/bin/boundary-latch scenarios --json > /tmp/scenarios.json
          /tmp/clean/bin/python -c "import json; d=json.load(open('/tmp/scenarios.json')); assert len(d)==10, len(d)"
          /tmp/clean/bin/python -c "import importlib.util as u; assert u.find_spec('redline') is None and u.find_spec('numpy') is None"
