name: release-dye

on:
  push:
    tags: ["dye-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
        working-directory: tools/dye
      - run: twine check tools/dye/dist/*
      - run: |
          tag="${GITHUB_REF_NAME#dye-v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('tools/dye/pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$version" || { echo "tag $tag does not match version $version"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dye-dist
          path: tools/dye/dist/
  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dye-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dye-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
