name: Idea or change
description: Suggest a rule, an example, a check, or another useful change.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you want to add or change, in plain words.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: What would this help you do?
    validations:
      required: true
  - type: dropdown
    id: willing
    attributes:
      label: Would you like to work on it?
      options:
        - Yes, once we agree on the change
        - No, just suggesting
    validations:
      required: true
