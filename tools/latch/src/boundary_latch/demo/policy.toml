[limits]
max_actions_per_run = 20
run_lifetime_seconds = 900
approval_lifetime_seconds = 600

# One run must not read a customer's own words, read account data, and act outside.
[flow]
all_three = "deny"

[tools.lookup_note]
require_permission = "accounts:read"
labels = ["untrusted"]

[tools.lookup_account]
require_permission = "accounts:read"
labels = ["sensitive"]

[tools.send_message]
require_permission = "messages:send"
approve_permission = "messages:approve"
recipient_field = "to"
allowed_recipients = ["help@northwind.example", "billing@northwind.example"]
labels = ["external"]
[tools.send_message.approval]
mode = "always"

[tools.issue_refund]
require_permission = "refunds:issue"
approve_permission = "refunds:approve"
labels = ["external"]
[tools.issue_refund.approval]
mode = "over_amount"
amount_field = "amount_minor"
threshold_minor = 5000
