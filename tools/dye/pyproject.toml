[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-dye"
version = "0.2.0"
description = "Dye finds tool call arguments that were copied from untrusted text"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Matt Grofsky" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]

[project.scripts]
boundary-dye = "boundary_dye.cli:main"

[project.urls]
Homepage = "https://github.com/mgrofsky/boundary-lab/tree/main/tools/dye"
Source = "https://github.com/mgrofsky/boundary-lab"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boundary_dye*"]

[tool.setuptools.package-data]
boundary_dye = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
